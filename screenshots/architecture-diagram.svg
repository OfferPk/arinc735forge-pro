<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="1000" height="620" fill="url(#bg)" rx="12"/>
  <rect x="2" y="2" width="996" height="616" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>
  
  <!-- Title Header -->
  <text x="40" y="50" fill="#00f0ff" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" letter-spacing="1">ARINC735Forge Pro - TCAS II / ACAS II System Architecture</text>
  <text x="40" y="75" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">ARINC Characteristic 735B (Traffic Computer) &amp; RTCA DO-185B / ICAO Annex 10 Vol IV (TCAS II Version 7.1)</text>

  <!-- Left: Directional Antennas & RF Receiver -->
  <g transform="translate(40, 110)">
    <rect width="260" height="460" fill="#131d31" stroke="#334155" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="260" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">RF &amp; SURVEILLANCE BUS</text>
    
    <rect x="15" y="60" width="230" height="75" fill="#0b1120" stroke="#00f0ff" stroke-width="1" rx="4"/>
    <text x="25" y="88" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">Top Directional Antenna</text>
    <text x="25" y="108" fill="#94a3b8" font-family="monospace" font-size="10">4-Element Electron Beam Steering</text>
    <text x="25" y="124" fill="#00e676" font-family="monospace" font-size="10">1030 MHz TX / 1090 MHz RX</text>

    <rect x="15" y="150" width="230" height="75" fill="#0b1120" stroke="#00f0ff" stroke-width="1" rx="4"/>
    <text x="25" y="178" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">Bottom Omnidirectional/Dir</text>
    <text x="25" y="198" fill="#94a3b8" font-family="monospace" font-size="10">Ground Multipath Rejection</text>
    <text x="25" y="214" fill="#00e676" font-family="monospace" font-size="10">1030 MHz TX / 1090 MHz RX</text>

    <rect x="15" y="240" width="230" height="95" fill="#0b1120" stroke="#ffb300" stroke-width="1" rx="4"/>
    <text x="25" y="268" fill="#ffb300" font-family="monospace" font-size="12" font-weight="bold">Whisper-Shout Sequence</text>
    <text x="25" y="290" fill="#94a3b8" font-family="monospace" font-size="10">• 6 Stepped RF Power Levels</text>
    <text x="25" y="308" fill="#94a3b8" font-family="monospace" font-size="10">• S1 Suppression Pulses</text>
    <text x="25" y="324" fill="#94a3b8" font-family="monospace" font-size="10">• Mode C / S Fruit Defruiting</text>

    <rect x="15" y="350" width="230" height="95" fill="#0b1120" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="25" y="378" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Mode S Transponder Interlock</text>
    <text x="25" y="398" fill="#94a3b8" font-family="monospace" font-size="10">• ARINC 718A Transponder Bus</text>
    <text x="25" y="416" fill="#94a3b8" font-family="monospace" font-size="10">• UF=16 Coordination Words</text>
    <text x="25" y="432" fill="#00e676" font-family="monospace" font-size="10">• Mutual Reverse Sense Lock</text>
  </g>

  <!-- Middle: TCAS II Traffic Computer Processor -->
  <g transform="translate(360, 110)">
    <rect width="280" height="460" fill="#131d31" stroke="#00f0ff" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="280" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#00f0ff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">ARINC 735B TRAFFIC COMPUTER</text>

    <!-- CAS Logic Kernel -->
    <rect x="15" y="55" width="250" height="390" fill="#0b1120" stroke="#00e676" stroke-width="1.5" rx="6"/>
    <text x="25" y="80" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">CAS LOGIC KERNEL (DO-185B)</text>
    
    <text x="25" y="105" fill="#f8fafc" font-family="monospace" font-size="11">• Tau Horizon (τ = -r / rdot)</text>
    <text x="25" y="125" fill="#f8fafc" font-family="monospace" font-size="11">• DMOD Protected Volume</text>
    <text x="25" y="145" fill="#f8fafc" font-family="monospace" font-size="11">• Sensitivity Levels SL 2 to 7</text>
    <text x="25" y="165" fill="#f8fafc" font-family="monospace" font-size="11">• ZTHR &amp; ALIM Vertical Margins</text>
    
    <line x1="25" y1="180" x2="250" y2="180" stroke="#334155" stroke-width="1"/>
    
    <text x="25" y="200" fill="#ffb300" font-family="monospace" font-size="11" font-weight="bold">THREAT CLASSIFICATION</text>
    <text x="25" y="220" fill="#f8fafc" font-family="monospace" font-size="10">◇ Other Traffic (&gt; 6 NM / &gt; 1200ft)</text>
    <text x="25" y="238" fill="#38bdf8" font-family="monospace" font-size="10">◆ Proximate Traffic (≤ 6 NM / ±1200ft)</text>
    <text x="25" y="256" fill="#ffb300" font-family="monospace" font-size="10">● Traffic Advisory (τ ≤ 48s, ZTHR)</text>
    <text x="25" y="274" fill="#ff3366" font-family="monospace" font-size="10">■ Resolution Advisory (τ ≤ 35s, ALIM)</text>

    <line x1="25" y1="290" x2="250" y2="290" stroke="#334155" stroke-width="1"/>

    <text x="25" y="310" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">TCAS II v7.1 AURAL &amp; SENSE</text>
    <text x="25" y="330" fill="#00e676" font-family="monospace" font-size="10">• "Level Off, Level Off" Mandate</text>
    <text x="25" y="348" fill="#f8fafc" font-family="monospace" font-size="10">• Corrective vs. Preventive RAs</text>
    <text x="25" y="366" fill="#ff3366" font-family="monospace" font-size="10">• Reversal: "Climb/Descend NOW"</text>
    <text x="25" y="384" fill="#f8fafc" font-family="monospace" font-size="10">• ARINC 429 Bit 32 Odd Parity</text>
    <text x="25" y="405" fill="#94a3b8" font-family="monospace" font-size="10">Chassis: 4-MCU / 6-MCU ARINC 600</text>
    <text x="25" y="425" fill="#00e676" font-family="monospace" font-size="10">TSO-C119e / ETSO-C119e Compliant</text>
  </g>

  <!-- Right: Cockpit Flight Deck Displays -->
  <g transform="translate(690, 110)">
    <rect width="270" height="460" fill="#131d31" stroke="#334155" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="270" height="40" fill="#1e293b" rx="8"/>
    <text x="20" y="26" fill="#00e676" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">FLIGHT DECK INTERFACES</text>

    <!-- PFD / VSI Guidance -->
    <rect x="15" y="55" width="240" height="115" fill="#0b1120" stroke="#00e676" stroke-width="1" rx="4"/>
    <text x="25" y="80" fill="#00e676" font-family="monospace" font-size="12" font-weight="bold">Primary Flight Display (PFD)</text>
    <text x="25" y="100" fill="#f8fafc" font-family="monospace" font-size="11">• Vertical Speed Tape Fly-To Arc</text>
    <text x="25" y="120" fill="#ff3366" font-family="monospace" font-size="11">• Red Avoidance Trapezoids</text>
    <text x="25" y="140" fill="#00e676" font-family="monospace" font-size="11">• Green Target VS (1500-2000 fpm)</text>
    <text x="25" y="158" fill="#94a3b8" font-family="monospace" font-size="10">Label 274 RA Command Broadcast</text>

    <!-- Navigation Display (ND) -->
    <rect x="15" y="185" width="240" height="115" fill="#0b1120" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="25" y="210" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Navigation Display (ND)</text>
    <text x="25" y="230" fill="#f8fafc" font-family="monospace" font-size="11">• Plan-Position Indicator (PPI)</text>
    <text x="25" y="250" fill="#f8fafc" font-family="monospace" font-size="11">• Traffic Symbology Overlay</text>
    <text x="25" y="270" fill="#f8fafc" font-family="monospace" font-size="11">• 3, 6, 12, 24 NM Range Rings</text>
    <text x="25" y="288" fill="#94a3b8" font-family="monospace" font-size="10">Labels 015, 016, 130 ARINC 429</text>

    <!-- Aural Warning Speaker -->
    <rect x="15" y="315" width="240" height="125" fill="#0b1120" stroke="#ff3366" stroke-width="1" rx="4"/>
    <text x="25" y="340" fill="#ff3366" font-family="monospace" font-size="12" font-weight="bold">Cockpit Aural Warning</text>
    <text x="25" y="362" fill="#ffb300" font-family="monospace" font-size="11">• "TRAFFIC, TRAFFIC"</text>
    <text x="25" y="380" fill="#ff3366" font-family="monospace" font-size="11">• "CLIMB, CLIMB" / "DESCEND"</text>
    <text x="25" y="398" fill="#00e676" font-family="monospace" font-size="11">• "LEVEL OFF, LEVEL OFF" (v7.1)</text>
    <text x="25" y="416" fill="#ff3366" font-family="monospace" font-size="11">• "CLIMB, CLIMB NOW" (Reversal)</text>
    <text x="25" y="434" fill="#00e676" font-family="monospace" font-size="10">• "CLEAR OF CONFLICT"</text>
  </g>

  <!-- Bus Interconnect Arrows -->
  <line x1="300" y1="220" x2="360" y2="220" stroke="#00f0ff" stroke-width="2.5"/>
  <text x="306" y="210" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">ARINC 429</text>

  <line x1="640" y1="220" x2="690" y2="220" stroke="#00e676" stroke-width="2.5"/>
  <text x="645" y="210" fill="#00e676" font-family="monospace" font-size="9" font-weight="bold">Labels 274/016</text>
</svg>