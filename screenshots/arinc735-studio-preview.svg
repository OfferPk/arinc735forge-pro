<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#sbg)" rx="10"/>
  <rect x="2" y="2" width="996" height="596" fill="none" stroke="#1e293b" stroke-width="2" rx="8"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#0f172a" rx="8"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#1e293b" stroke-width="1.5"/>
  <text x="25" y="32" fill="#00f0ff" font-family="monospace" font-size="16" font-weight="bold">ARINC735Forge Pro - TCAS II / ACAS II Avionics Studio</text>
  <rect x="670" y="15" width="145" height="22" fill="rgba(0,240,255,0.15)" stroke="#00f0ff" rx="4"/>
  <text x="682" y="30" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">ARINC 735B / DO-185B</text>
  <rect x="825" y="15" width="150" height="22" fill="rgba(0,230,118,0.15)" stroke="#00e676" rx="4"/>
  <text x="837" y="30" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">TCAS II v7.1 CERTIFIED</text>

  <!-- Left: TCAS Radar Display -->
  <g transform="translate(25, 70)">
    <rect width="460" height="305" fill="#050811" stroke="#1e293b" rx="6"/>
    <text x="18" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">TCAS PPI DISPLAY (10 NM RANGE RINGS)</text>
    
    <!-- Range Rings -->
    <circle cx="230" cy="165" r="120" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="230" cy="165" r="80" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="230" cy="165" r="40" fill="none" stroke="#1e293b" stroke-width="1"/>
    
    <text x="235" y="90" fill="#475569" font-family="monospace" font-size="9">6 NM</text>
    <text x="235" y="50" fill="#475569" font-family="monospace" font-size="9">10 NM</text>

    <!-- Crosshairs -->
    <line x1="230" y1="40" x2="230" y2="290" stroke="#1e293b" stroke-width="1"/>
    <line x1="100" y1="165" x2="360" y2="165" stroke="#1e293b" stroke-width="1"/>

    <!-- Ownship Symbol -->
    <polygon points="230,153 222,173 230,169 238,173" fill="none" stroke="#f8fafc" stroke-width="2.5"/>

    <!-- Intruder 1: Resolution Advisory (Red Square) -->
    <rect x="268" y="118" width="14" height="14" fill="#ff3366"/>
    <text x="288" y="129" fill="#ff3366" font-family="monospace" font-size="11" font-weight="bold">+03 ↑</text>
    <text x="288" y="142" fill="#ff3366" font-family="monospace" font-size="9">RA (τ=16s)</text>

    <!-- Intruder 2: Traffic Advisory (Amber Circle) -->
    <circle cx="160" cy="110" r="7" fill="#ffb300"/>
    <text x="175" y="114" fill="#ffb300" font-family="monospace" font-size="10" font-weight="bold">+08 ↑</text>

    <!-- Intruder 3: Proximate Traffic (Cyan Diamond) -->
    <polygon points="310,210 316,216 310,222 304,216" fill="#38bdf8"/>
    <text x="322" y="220" fill="#38bdf8" font-family="monospace" font-size="10">-11</text>

    <!-- Aural Alert Banner Overlay -->
    <rect x="130" y="32" width="200" height="28" fill="rgba(255,51,102,0.25)" stroke="#ff3366" rx="4"/>
    <text x="160" y="51" fill="#ff3366" font-family="monospace" font-size="13" font-weight="bold">CLIMB, CLIMB</text>
  </g>

  <!-- Right: Encounter Parameters & Telemetry -->
  <g transform="translate(515, 70)">
    <rect width="460" height="305" fill="#131d31" stroke="#1e293b" rx="6"/>
    <text x="18" y="26" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">TCAS ENCOUNTER GEOMETRY &amp; ARINC 429</text>
    <rect x="345" y="12" width="100" height="20" fill="rgba(0,230,118,0.2)" stroke="#00e676" rx="3"/>
    <text x="355" y="26" fill="#00e676" font-family="monospace" font-size="10" font-weight="bold">SL 7 (FL320)</text>

    <text x="18" y="60" fill="#94a3b8" font-family="monospace" font-size="11">Ownship Alt:</text>
    <text x="160" y="60" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">32,000 ft (FL320)</text>

    <text x="18" y="82" fill="#94a3b8" font-family="monospace" font-size="11">Intruder Alt:</text>
    <text x="160" y="82" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">32,300 ft (+300 ft)</text>

    <text x="18" y="104" fill="#94a3b8" font-family="monospace" font-size="11">Slant Range:</text>
    <text x="160" y="104" fill="#ff3366" font-family="monospace" font-size="11" font-weight="bold">2.2 NM (Closing)</text>

    <text x="18" y="126" fill="#94a3b8" font-family="monospace" font-size="11">Closure Rate:</text>
    <text x="160" y="126" fill="#ff3366" font-family="monospace" font-size="11" font-weight="bold">-480 kts (Relative)</text>

    <text x="18" y="148" fill="#94a3b8" font-family="monospace" font-size="11">Range Tau (τ):</text>
    <text x="160" y="148" fill="#ff3366" font-family="monospace" font-size="11" font-weight="bold">16.5 sec (RA Threshold: 35s)</text>

    <text x="18" y="170" fill="#94a3b8" font-family="monospace" font-size="11">Resolution Adv:</text>
    <text x="160" y="170" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">CORRECTIVE CLIMB (+1500 fpm)</text>

    <text x="18" y="192" fill="#94a3b8" font-family="monospace" font-size="11">Version 7.1 Alert:</text>
    <text x="160" y="192" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">"LEVEL OFF, LEVEL OFF" Armed</text>

    <!-- Mini ARINC 429 Table -->
    <rect x="15" y="210" width="430" height="80" fill="#0b1120" stroke="#334155" rx="4"/>
    <text x="25" y="230" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">LBL</text>
    <text x="75" y="230" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">FUNCTION</text>
    <text x="260" y="230" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">PAYLOAD</text>
    <text x="365" y="230" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">PARITY</text>

    <text x="25" y="252" fill="#f8fafc" font-family="monospace" font-size="10">0274</text>
    <text x="75" y="252" fill="#f8fafc" font-family="monospace" font-size="10">RA Command Broadcast</text>
    <text x="260" y="252" fill="#38bdf8" font-family="monospace" font-size="10">0x000F8</text>
    <text x="365" y="252" fill="#00e676" font-family="monospace" font-size="10">ODD [P=1]</text>

    <text x="25" y="274" fill="#f8fafc" font-family="monospace" font-size="10">0016</text>
    <text x="75" y="274" fill="#f8fafc" font-family="monospace" font-size="10">Intruder Record</text>
    <text x="260" y="274" fill="#38bdf8" font-family="monospace" font-size="10">0x15E28</text>
    <text x="365" y="274" fill="#00e676" font-family="monospace" font-size="10">ODD [P=0]</text>
  </g>

  <!-- Bottom: 10-Point Normative Auditor Scorecard -->
  <g transform="translate(25, 395)">
    <rect width="950" height="185" fill="#131d31" stroke="#1e293b" rx="6"/>
    <text x="18" y="28" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">10-POINT NORMATIVE AIRWORTHINESS AUDITOR SCORECARD</text>
    <rect x="760" y="12" width="175" height="22" fill="rgba(0,230,118,0.2)" stroke="#00e676" rx="4"/>
    <text x="770" y="27" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">10 / 10 RULES PASSED (100%)</text>

    <g transform="translate(18, 45)">
      <text x="0" y="18" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_01] TCAS II v7.1 "Level Off" Aural Mandate (ICAO Annex 10)</text>
      <text x="0" y="42" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_02] ARINC 429 Bit 32 Odd Parity Rule (Labels 015, 016, 274)</text>
      <text x="0" y="66" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_03] Tau Closing Horizons SL 2 to 7 (DO-185B Table 2-11)</text>
      <text x="0" y="90" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_04] DMOD Protected Airspace Volume Calculation (§2.2.4.2)</text>
      <text x="0" y="114" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_05] Vertical Threshold ZTHR &amp; ALIM Separation Criteria</text>

      <text x="490" y="18" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_06] Air-to-Air Mode S Coordination Protocol (UF=16 Lock)</text>
      <text x="490" y="42" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_07] Whisper-Shout 1030 MHz Interrogation Sequence</text>
      <text x="490" y="66" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_08] Corrective vs. Preventive RA State Classification</text>
      <text x="490" y="90" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_09] Emergency Reversal Sense Switching ("Climb/Descend NOW")</text>
      <text x="490" y="114" fill="#00e676" font-family="monospace" font-size="11" font-weight="bold">✓ [A735_10] Commercial Airframe 4-MCU / 6-MCU Form Factor &amp; EFIS</text>
    </g>
  </g>
</svg>